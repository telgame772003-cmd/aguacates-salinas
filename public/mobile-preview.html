<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Móvil Local (390×844) | Aguacates Salinas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 12px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    .toolbar button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .toolbar button.active {
      background: #15803d;
      border-color: #22c55e;
      color: #fff;
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      max-height: calc(100vh - 76px);
      background: #fff;
      border: 10px solid #1e293b;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span style="font-size:12px;color:#94a3b8;font-weight:700;">📱 Vista Móvil (390×844):</span>
    <button type="button" class="active" data-url="/almacen.html">❄️ Almacén</button>
    <button type="button" data-url="/ruta.html">🚗 Chofer</button>
    <button type="button" data-url="/index.html">🥑 Tienda</button>
    <button type="button" data-url="/admin.html">⚙️ Admin</button>
  </div>
  <div class="phone-frame">
    <iframe id="phoneFrame" src="/almacen.html"></iframe>
  </div>
  <script>
    const frame = document.getElementById("phoneFrame");
    document.querySelectorAll(".toolbar button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".toolbar button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        frame.src = btn.dataset.url;
      });
    });
  </script>
</body>
</html>
